worker_processes 1;

events { worker_connections 2048; }

http {
  # ── Restricción del reto: gateway a 15 req/s ─────────────────────────────
  # Token bucket global ($server_name = clave constante ⇒ límite global, no por IP).
  # rate=15r/s  → flujo sostenido permitido (la restricción).
  # burst=1000  → absorbe la ráfaga completa de k6 (1000 req) sin un solo 503;
  #               equivale al burst por defecto de AWS API Gateway.
  # nodelay     → las peticiones del burst se atienden de inmediato, sin encolar
  #               en nginx (sin él, la petición 1000 esperaría ~66 s).
  limit_req_zone $server_name zone=gateway:1m rate=15r/s;

  # Access log con timestamp ISO: evidencia de que las 1000 peticiones entraron.
  log_format evidencia '$time_iso8601 $remote_addr "$request" $status '
                       'rt=$request_time';
  access_log /dev/stdout evidencia;

  upstream api_upstream {
    server api:3000;   # DNS de docker resuelve a las 2 réplicas (round-robin)
  }

  server {
    listen 80;

    location /events {
      limit_req zone=gateway burst=1000 nodelay;
      limit_req_status 429;

      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location /health {
      return 200 "ok\n";
    }
  }
}
